[project]
name = "spam-detector-service"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx",
    "pydantic>=2.9,<3",
    "pyyaml",
    "regex>=2024.11.6",
    "uvicorn>=0.30,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
